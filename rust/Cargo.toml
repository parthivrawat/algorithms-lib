[package]
name = "algorithms-lib"
version = "2.0.0"
edition = "2021"
rust-version = "1.62"
authors = ["Parthiv Rawat"]
license = "MIT"
description = "A comprehensive, zero-dependency collection of common algorithms for Rust"
repository = "https://github.com/parthivrawat/algorithms-lib"
